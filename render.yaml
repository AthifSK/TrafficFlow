services:
  - type: web
    name: trafficflow-backend
    runtime: python
    rootDir: trafficflow/backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
